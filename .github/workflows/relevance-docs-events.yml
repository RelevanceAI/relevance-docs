name: Notify Relevance Docs Workforce

# Pushes PR + drafter:go events to the Relevance "Docs Workforce v2" custom webhooks.
#
# Two doors, so a review and a drafter:go label can never race each other:
#   door A  RELEVANCE_DOCS_WEBHOOK_URL         -> Docs Orchestrator.  drafter:go only.  kind=drafter_go
#   door B  RELEVANCE_DOCS_STATUS_WEBHOOK_URL  -> Docs Notifier.      status only.      kind=status
#
# Both carry correlation_id, recovered from the <!-- docs-run-id: ... --> marker the Docs
# Drafter has Claude write into the PR body. That is what threads every later event back to
# the workforce task that created the PR. Falls back to the PR URL when no marker is present
# (hand-made PRs, or PRs opened before the marker existed).

# `opened` IS forwarded, and it is what announces a finished PR.
#
# History, because this has been both ways: originally the authoring run posted the card
# AND `opened` was forwarded, which gave the card two independent creators racing each
# other — on #758 the webhook won by 49s with a thinner card, the authoring run posted a
# second, and the ledger kept only one. #759 dropped `opened` to fix that.
#
# But Claude Code is asynchronous. On a large job the authoring run finishes long before
# the PR exists, so it has no URL to post and the PR landed in silence. So the shape is
# now the async-correct one: the authoring run never creates the card, and `opened` does.
# One creator again, just a different one.
#
# `authored` tells the Notifier whether this is a PR the workforce produced — true when the
# body carries the docs-run-id marker. Only those may create a card; a hand-made PR is
# still ignored, which is the documented behaviour (Slack only shows PRs that came
# through the gate).
on:
  pull_request:
    types: [opened, synchronize, closed, labeled]
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  notify:
    runs-on: ubuntu-latest
    # Doc-workforce PRs only: Claude-authored, or docs-drafter-labelled, or a drafter:go label event.
    # A `labeled` event for any OTHER label is ignored — it is neither a status change nor an action signal.
    if: >-
      (
        github.event.action != 'labeled' &&
        (
          github.event.pull_request.user.login == 'claude[bot]' ||
          contains(github.event.pull_request.labels.*.name, 'docs-drafter')
        )
      ) ||
      (github.event.action == 'labeled' && github.event.label.name == 'drafter:go')
    steps:
      - name: POST event to the Relevance Docs Workforce
        env:
          ACTION_WEBHOOK_URL: ${{ secrets.RELEVANCE_DOCS_WEBHOOK_URL }}
          STATUS_WEBHOOK_URL: ${{ secrets.RELEVANCE_DOCS_STATUS_WEBHOOK_URL }}
          EVENT_TYPE: ${{ github.event_name }}.${{ github.event.action }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          LABEL: ${{ github.event.label.name }}
          REVIEW_STATE: ${{ github.event.review.state }}
          MERGED: ${{ github.event.pull_request.merged }}
          DELIVERY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          IS_DRAFTER_GO: ${{ github.event.action == 'labeled' && github.event.label.name == 'drafter:go' }}
        run: |
          set -euo pipefail

          # Pick the door. drafter:go is the only thing that wakes the Orchestrator.
          if [ "$IS_DRAFTER_GO" = "true" ]; then
            KIND="drafter_go"
            WEBHOOK_URL="$ACTION_WEBHOOK_URL"
            DOOR="A (orchestrator)"
          else
            KIND="status"
            WEBHOOK_URL="$STATUS_WEBHOOK_URL"
            DOOR="B (notifier)"
          fi

          if [ -z "$WEBHOOK_URL" ]; then
            echo "No webhook URL configured for door $DOOR — skipping (no-op until the secret is added)." >&2
            exit 0
          fi

          # correlation_id: the marker the Drafter stamped into the PR body, else the PR URL.
          # PR_BODY is read from the environment, never interpolated into this script.
          #
          # Requires the FULL HTML-comment form, and takes the LAST match. Both matter:
          #  - anchoring on <!-- ... --> stops a body that merely *mentions* "docs-run-id:"
          #    in prose from beating the real marker;
          #  - taking the last match stops a worked example beating the real one;
          #  - requiring the closing --> stops the `-` in the character class from eating
          #    into it (`<!--docs-run-id:pr-321-->` would otherwise yield "pr-321--").
          # Every malformed case falls through to the PR-URL fallback below. That is the safe
          # direction: a bogus id is worse than none, because it is non-empty, so the fallback
          # would never fire and the PR would thread silently under a garbage key.
          #
          # Correlation ids are contracted to [A-Za-z0-9._-] — intake must mint them in that
          # set (pr-1234, slack-1754449731.482, pylon-<id>).
          MARKER="$(printf '%s' "$PR_BODY" \
            | grep -oiE '<!--[[:space:]]*docs-run-id:[[:space:]]*[A-Za-z0-9._-]+[[:space:]]*-->' \
            | tail -n1 || true)"
          CORRELATION_ID="$(printf '%s' "$MARKER" | sed -E 's/[[:space:]]*-->$//; s/^.*:[[:space:]]*//')"

          # The marker is also how we know this is our own PR rather than a hand-made one.
          # Only our own may create a status card.
          if [ -n "$CORRELATION_ID" ]; then
            AUTHORED="true"
          else
            AUTHORED="false"
            CORRELATION_ID="$PR_URL"
            echo "No docs-run-id marker on PR #${PR_NUMBER} — not workforce-authored; falling back to the PR URL as correlation_id." >&2
          fi

          echo "door=${DOOR} kind=${KIND} event=${EVENT_TYPE} authored=${AUTHORED} correlation_id=${CORRELATION_ID}"

          jq -n \
            --arg kind "$KIND" \
            --arg correlation_id "$CORRELATION_ID" \
            --arg event_type "$EVENT_TYPE" \
            --arg repo "$REPO" \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_url "$PR_URL" \
            --arg title "$PR_TITLE" \
            --arg label "$LABEL" \
            --arg review_state "$REVIEW_STATE" \
            --arg merged "$MERGED" \
            --arg authored "$AUTHORED" \
            --arg delivery_id "$DELIVERY_ID" \
            '{
              kind:           $kind,
              correlation_id: $correlation_id,
              authored:       $authored,
              event_type:     $event_type,
              repo:           $repo,
              pr_number:      ($pr_number|tonumber? // null),
              pr_url:         $pr_url,
              title:          $title,
              label:          $label,
              review_state:   $review_state,
              merged:         $merged,
              delivery_id:    $delivery_id
            }' \
          | curl -sS --fail-with-body -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @-
